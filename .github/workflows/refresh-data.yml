name: Auto-refresh live data

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/refresh.py'
      - '.github/workflows/refresh-data.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch APOD, launches, space weather, news and videos
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          APOD_DEBUG: '1'
        run: python3 scripts/refresh.py

      - name: Commit changes (if any)
        id: commit
        run: |
          git config user.name  "star-academy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "chore(data): auto-refresh live data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main || true
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request a GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped"
